[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "dockprompt"
version = "0.1.0"
description = "Turn your Linux desktop geometry into an AI-ready image-editing prompt"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.optional-dependencies]
image = ["Pillow>=10.0"]

[project.scripts]
dockprompt = "dockprompt.cli:main"
